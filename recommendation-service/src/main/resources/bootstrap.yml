spring:
  application:
    name: recommendation-service
  threads:
    virtual:
      enabled: true
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
