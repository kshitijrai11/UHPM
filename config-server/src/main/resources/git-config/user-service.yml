# User Service - Default Configuration
server:
  port: 8201

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ultrahpm_user
    username: ${DB_USERNAME:ultrahpm}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ultrahpm_user
    username: ${DB_USERNAME:ultrahpm}
    password: ${DB_PASSWORD:password}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      group-id: user-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      version: ${app.version:1.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ultrahpm.user: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:ultra-secret-key-2025}
    expiration: 86400000  # 24 hours
  rate-limit:
    requests-per-minute: 100
  feature:
    new-registration: false
  cache:
    ttl: 3600
