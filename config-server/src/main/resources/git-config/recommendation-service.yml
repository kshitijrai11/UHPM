server:
  port: 8206

spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ultrahpm_recommendations
    username: ultrahpm_user
    password: ultrahpm_password
    pool:
      max-size: 20
      initial-size: 5
      max-idle-time: 30m

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: recommendation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

grpc:
  client:
    product-service:
      address: static://localhost:9090
      negotiation-type: plaintext

model:
  path: ${MODEL_PATH:models/recommendation_model.onnx}
