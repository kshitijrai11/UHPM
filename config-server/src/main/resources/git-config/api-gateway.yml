# API Gateway - Default Configuration
spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "https://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            # User Service Routes
            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**, /api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@redisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service-cb
                    fallbackUri: forward:/fallback/user
    
            # Product Service Routes
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**, /graphql
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@redisRateLimiter}"
                    key-resolver: "#{@pathKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: product-service-cb
                    fallbackUri: forward:/fallback/product

            # Recommendation Service Routes
            - id: recommendation-service-v1
              uri: lb://recommendation-service
              predicates:
                - Path=/api/recommendations/**
                - Weight=recommendation-group, 80
              filters:
                - name: CircuitBreaker
                  args:
                    name: recommendation-service-cb
                    fallbackUri: forward:/fallback/recommendation
            - id: recommendation-service-v2
              uri: lb://recommendation-service-v2
              predicates:
                - Path=/api/recommendations/**
                - Weight=recommendation-group, 20
              filters:
                - name: CircuitBreaker
                  args:
                    name: recommendation-service-cb
                    fallbackUri: forward:/fallback/recommendation
    
            # Order Service Routes
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET,POST
                - name: CircuitBreaker
                  args:
                    name: order-service-cb

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2

server:
  port: ${SERVER_PORT:8200}
  http2:
    enabled: true
  compression:
    enabled: true
  netty:
    connection-timeout: 2s
    h2c-max-content-length: 0B
    initial-buffer-size: 128B

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics,circuitbreakers,refresh
  endpoint:
    health:
      show-details: always
      show-components: always
    gateway:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
    instances:
      product-service-cb:
        base-config: default
      order-service-cb:
        base-config: default
      payment-service-cb:
        base-config: default
      notification-service-cb:
        base-config: default
      recommendation-service-cb:
        base-config: default

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException

  timelimiter:
    configs:
      default:
        timeout-duration: 5s

jwt:
  secret: ${JWT_SECRET:ultrahpm-super-secret-key-for-jwt-signing-minimum-256-bits-long-key}
  expiration: 86400000

logging:
  level:
    com.ultrahpm.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr([%t]){faint} %clr(%logger{36}){cyan} %clr(:){faint} %m%n"
