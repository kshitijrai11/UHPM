# Payment Service - Default Configuration
server:
  port: 8204

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ultrahpm_payment
    username: ${DB_USERNAME:ultrahpm}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  r2dbc:
    url: r2dbc:postgresql://postgres:5432/ultrahpm_payment
    username: ${DB_USERNAME:ultrahpm}
    password: ${DB_PASSWORD:password}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  flyway:
    enabled: true
    baseline-on-migrate: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      version: ${app.version:1.0.0}

# gRPC server configuration
grpc:
  server:
    port: 9094

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ultrahpm.payment: INFO

app:
  payment:
    provider: stripe
    timeout: 5000
