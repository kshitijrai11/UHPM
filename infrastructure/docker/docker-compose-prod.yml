services:
  # Base Infrastructure
  config-server:
    image: ultrahpm/config-server:latest
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - CONFIG_SERVER_USERNAME=config
      - CONFIG_SERVER_PASSWORD=ultra2025
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://config:ultra2025@localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  eureka-server:
    image: ultrahpm/eureka-server:latest
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  api-gateway:
    image: ultrahpm/api-gateway:latest
    ports:
      - "8200:8200"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - REDIS_HOST=redis
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  user-service:
    image: ultrahpm/user-service:latest
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_USERNAME=ultrahpm
      - DB_PASSWORD=ultrahpm123
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ultrahpm_user
      - SPRING_DATASOURCE_USERNAME=ultrahpm
      - SPRING_DATASOURCE_PASSWORD=ultrahpm123
      - REDIS_HOST=redis
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  product-service:
    image: ultrahpm/product-service:latest
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_USERNAME=ultrahpm
      - DB_PASSWORD=ultrahpm123
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ultrahpm_product
      - SPRING_DATASOURCE_USERNAME=ultrahpm
      - SPRING_DATASOURCE_PASSWORD=ultrahpm123
      - REDIS_HOST=redis
      - SPRING_REDIS_HOST=redis
      - ELASTICSEARCH_HOST=elasticsearch
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  order-service:
    image: ultrahpm/order-service:latest
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_USERNAME=ultrahpm
      - DB_PASSWORD=ultrahpm123
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ultrahpm_order
      - SPRING_DATASOURCE_USERNAME=ultrahpm
      - SPRING_DATASOURCE_PASSWORD=ultrahpm123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  payment-service:
    image: ultrahpm/payment-service:latest
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_USERNAME=ultrahpm
      - DB_PASSWORD=ultrahpm123
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ultrahpm_payment
      - SPRING_DATASOURCE_USERNAME=ultrahpm
      - SPRING_DATASOURCE_PASSWORD=ultrahpm123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  notification-service:
    image: ultrahpm/notification-service:latest
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  recommendation-service:
    image: ultrahpm/recommendation-service:latest
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config:ultra2025@config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=config
      - SPRING_CLOUD_CONFIG_PASSWORD=ultra2025
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - ELASTICSEARCH_HOST=elasticsearch
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - JAVA_OPTS=--enable-preview -Xms128m -Xmx256m

  # Infrastructure Services
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ultrahpm
      POSTGRES_USER: ultrahpm
      POSTGRES_PASSWORD: ultrahpm123
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  grafana_data:
