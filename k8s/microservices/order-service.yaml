apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: order-service
          image: ultrahpm/order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka/"
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
            - name: DB_USERNAME
              value: "ultrahpm_user"
            - name: DB_PASSWORD
              value: "ultrahpm_password"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/ultrahpm_order"
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://postgres:5432/ultrahpm_order"
            - name: REDIS_HOST
              value: "redis"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
