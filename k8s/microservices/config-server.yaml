---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-config
  namespace: ultrahpm
data:
  SPRING_PROFILES_ACTIVE: "git,prod"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

---
apiVersion: v1
kind: Secret
metadata:
  name: config-server-secrets
  namespace: ultrahpm
type: Opaque
stringData:
  CONFIG_SERVER_USERNAME: "config"
  CONFIG_SERVER_PASSWORD: "ultra2025"
  ENCRYPT_KEY: "production-ultra-secret-key-for-config-server"
  # This would contain the actual Git SSH key or token in a real production environment

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ultrahpm
  labels:
    app: config-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: config-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: config-server
          image: ultrahpm/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: config-server-config
            - secretRef:
                name: config-server-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              httpHeaders:
                - name: Authorization
                  value: Basic Y29uZmlnOnVsdHJhMjAyNQ== # base64 config:ultra2025
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              httpHeaders:
                - name: Authorization
                  value: Basic Y29uZmlnOnVsdHJhMjAyNQ== 
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ultrahpm
  labels:
    app: config-server
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
      name: http
  selector:
    app: config-server
