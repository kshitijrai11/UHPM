apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: recommendation-service
          image: ultrahpm/recommendation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8206
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka/"
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
            - name: DB_USERNAME
              value: "ultrahpm_user"
            - name: DB_PASSWORD
              value: "ultrahpm_password"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/ultrahpm_recommendations"
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://postgres:5432/ultrahpm_recommendations"
            - name: REDIS_HOST
              value: "redis"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          volumeMounts:
            - name: onnx-models
              mountPath: /models
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
      volumes:
        - name: onnx-models
          persistentVolumeClaim:
            claimName: onnx-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
spec:
  selector:
    app: recommendation-service
  ports:
    - protocol: TCP
      port: 8206
      targetPort: 8206
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onnx-models-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
