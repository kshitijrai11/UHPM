apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: payment-service
          image: ultrahpm/payment-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8204
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config:ultra2025@config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka/"
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
            - name: JAVA_OPTS
              value: "-XX:+UseZGC -XX:+ZGenerational --enable-preview"
            - name: DB_USERNAME
              value: "ultrahpm_user"
            - name: DB_PASSWORD
              value: "ultrahpm_password"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/ultrahpm_payment"
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://postgres:5432/ultrahpm_payment"
            - name: REDIS_HOST
              value: "redis"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 8204
      targetPort: 8204
