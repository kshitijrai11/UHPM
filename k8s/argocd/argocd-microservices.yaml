apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ultrahpm-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kshitijrai11/UHPM.git' # Replace with actual repo URL
    targetRevision: HEAD
    path: UltraHPM/k8s/microservices
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ultrahpm-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
