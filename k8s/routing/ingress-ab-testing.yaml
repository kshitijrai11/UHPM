apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recommendation-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: api.ultrahpm.local
    http:
      paths:
      - path: /api/v1/recommendations
        pathType: Prefix
        backend:
          service:
            name: recommendation-service
            port:
              number: 8085
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recommendation-ingress-canary
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  rules:
  - host: api.ultrahpm.local
    http:
      paths:
      - path: /api/v1/recommendations
        pathType: Prefix
        backend:
          service:
            name: recommendation-service-v2 # Assuming a v2 service exists for A/B testing
            port:
              number: 8085
